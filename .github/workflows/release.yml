name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x64
            target: bun-linux-x64
            artifact: fl0w-linux-x64
            runner: ubuntu-latest
          - label: linux-arm64
            target: bun-linux-arm64
            artifact: fl0w-linux-arm64
            runner: ubuntu-latest
          - label: linux-x64-musl
            target: bun-linux-x64-musl
            artifact: fl0w-linux-x64-musl
            runner: ubuntu-latest
          - label: linux-arm64-musl
            target: bun-linux-arm64-musl
            artifact: fl0w-linux-arm64-musl
            runner: ubuntu-latest
          - label: darwin-x64
            target: bun-darwin-x64
            artifact: fl0w-darwin-x64
            runner: ubuntu-latest
          - label: darwin-arm64
            target: bun-darwin-arm64
            artifact: fl0w-darwin-arm64
            runner: ubuntu-latest
          - label: windows-x64
            target: bun-windows-x64
            artifact: fl0w-windows-x64.exe
            runner: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install

      - name: Install OpenTUI native packages for all platforms
        run: bun run install:opentui-platforms

      - name: Compile binary
        shell: bash
        run: |
          bun run build:${{ matrix.label }}
          ls -lh dist/${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum fl0w-* > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/fl0w-*
            dist/SHA256SUMS
            install.sh
            install.ps1
